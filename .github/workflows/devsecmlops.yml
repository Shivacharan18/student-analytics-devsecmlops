name: DevSecMLOps CI/CD & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── STAGE 1: Code Quality & Linting ───────────────────────────────────────
  lint-and-quality:
    name: 🎨 Code Linting & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          flake8 src/ app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ── STAGE 2: DevSecOps SAST (Static Application Security Testing) ───────────
  sast-security-scan:
    name: 🛡️ SAST Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Scan
        run: |
          bandit -r src/ app/ -ll -ii

  # ── STAGE 3: DevSecOps SCA (Software Composition Analysis) ─────────────────
  sca-dependency-scan:
    name: 📦 SCA Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run Dependency Vulnerability Scan
        run: |
          pip-audit -r requirements.txt || true

  # ── STAGE 4: Automated Testing & Data Validation ──────────────────────────
  automated-tests:
    name: 🧪 Automated Testing (Pytest)
    runs-on: ubuntu-latest
    needs: [lint-and-quality, sast-security-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Preprocessing & Training
        run: |
          python -m src.data_preprocessing
          python -m src.train

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v

  # ── STAGE 5: MLOps Quality Gate ──────────────────────────────────────────
  mlops-quality-gate:
    name: 🎯 MLOps Model Quality Gate
    runs-on: ubuntu-latest
    needs: [automated-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Model & Verify Quality Gates
        run: |
          python -m src.train

  # ── STAGE 6: Container Build & Verification ──────────────────────────────
  container-build:
    name: 🐳 Docker Container Build & Verification
    runs-on: ubuntu-latest
    needs: [mlops-quality-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t student-analytics:latest .
